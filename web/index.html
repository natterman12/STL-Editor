<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STL Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo"></span>STL Editor</div>
    <div class="menus">
      <button class="menu-btn" data-menu="file">File</button>
      <button class="menu-btn" data-menu="edit">Edit</button>
      <button class="menu-btn" data-menu="view">View</button>
      <button class="menu-btn" data-menu="help">Help</button>
    </div>
    <div class="quick">
      <button class="icon-btn" id="btn-undo" title="Undo (Ctrl+Z)"></button>
      <button class="icon-btn" id="btn-redo" title="Redo (Ctrl+Y)"></button>
      <button class="icon-btn" id="btn-save" title="Save (Ctrl+S)"></button>
      <span class="qsep"></span>
      <button class="icon-btn" id="btn-insert" title="Insert Mesh (Ctrl+I)"></button>
      <button class="icon-btn" id="btn-export" title="Export"></button>
    </div>
    <div id="doc-title">Untitled</div>
  </header>

  <nav id="ribbon">
    <div id="ribbon-tabs"></div>
    <div id="ribbon-body"></div>
  </nav>

  <main id="workspace">
    <aside id="browser" class="panel">
      <div class="panel-title">Browser</div>
      <div id="tree"></div>
    </aside>

    <section id="viewport">
      <canvas id="view3d"></canvas>
      <div id="viewcube">
        <button data-view="top">Top</button>
        <button data-view="front">Front</button>
        <button data-view="right">Right</button>
        <button data-view="iso">Iso</button>
        <button data-view="left">Left</button>
        <button data-view="back">Back</button>
        <button data-view="bottom">Bottom</button>
        <button data-view="fit" title="Fit all (F)">Fit</button>
      </div>
      <div id="hud" class="hidden"></div>
      <div id="sketch-hud" class="hidden">
        <div class="row"><label id="dyn-a-label">Length</label><input id="dyn-a" type="text" autocomplete="off"></div>
        <div class="row"><label id="dyn-b-label">Angle</label><input id="dyn-b" type="text" autocomplete="off"></div>
      </div>
      <div id="hint"></div>
      <div id="empty-state">
        <div class="empty-card">
          <h2>Open an STL to get started</h2>
          <p>Drop STL, 3MF or OBJ files here, or</p>
          <div class="empty-actions">
            <button class="primary" id="empty-open">Open mesh&hellip;</button>
            <button id="empty-box">Start with a box</button>
          </div>
          <div id="empty-recent"></div>
          <div class="empty-foot">Free and open source · <a href="#" data-url="https://ko-fi.com/natterman12">Support STL Editor <span>&hearts;</span></a></div>
        </div>
      </div>
      <div id="drop-overlay" class="hidden"><div>Drop to insert meshes</div></div>
    </section>

    <aside id="tool-panel" class="panel hidden">
      <div class="panel-title"><span id="tool-title">Tool</span><button class="x" id="tool-close" title="Cancel (Esc)">&times;</button></div>
      <div id="tool-form"></div>
      <div id="tool-msg"></div>
      <div class="tool-actions">
        <button id="tool-cancel">Cancel</button>
        <button id="tool-ok" class="primary">OK</button>
      </div>
    </aside>
  </main>

  <footer id="timeline-bar">
    <div class="tl-controls">
      <button class="icon-btn" id="tl-start" title="Roll back to start"></button>
      <button class="icon-btn" id="tl-prev" title="Step back"></button>
      <button class="icon-btn" id="tl-next" title="Step forward"></button>
      <button class="icon-btn" id="tl-end" title="Roll forward to end"></button>
    </div>
    <div id="timeline"></div>
    <div id="status"></div>
  </footer>
</div>

<div id="menu" class="hidden"></div>
<div id="toasts"></div>
<div id="busy" class="hidden"><div class="spinner"></div><div id="busy-msg">Working&hellip;</div></div>
<div id="modal" class="hidden"><div class="modal-card"><div id="modal-body"></div><div class="modal-actions" id="modal-actions"></div></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
