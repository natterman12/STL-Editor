name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Engine tests (${{ startsWith(matrix.os, 'windows') && 'Windows' || startsWith(matrix.os, 'macos') && 'macOS' || 'Linux' }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements.txt pytest

      - name: Install dependencies (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -m pip install -r requirements.txt pytest

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q tests

      - name: Run tests (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python3 -m pytest -q tests

  web:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check every UI module parses
        run: |
          for f in web/js/*.js; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done
