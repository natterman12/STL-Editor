name: Support Fins update

# Keeps the Support Fins engine (github.com/gittrahan/support-fins) current in every edition.
# Every day, if Support Fins has published a new vX.Y.Z release, this brings it in on a branch
# (support-fins/vX.Y.Z, made from main):
#   1. bundle the engine (packaging/update_support_fins.py), rebuild the 1.x web edition's copy
#      and the copy installed apps download (packaging/build_web.py), and rebuild the 2.0 golden
#      files that name the engine (dev/parity/fins_bump.py);
#   2. run the Rust and Tests workflows on that branch;
#   3. merge the branch into main when both pass and only the version number moved. If the fins
#      or the engine's report came out different, or a check failed, the branch is left for a
#      person and an issue says what to look at. Nothing is tried again for that engine while
#      the issue is open.
# (No pull request: this repository doesn't let workflows open one.)
# After the merge:
#   - The 1.x web edition (/app1/) updates when GitHub Pages deploys.
#   - Installed desktop apps, 1.x and 2.0, download the new engine from the Pages site
#     (/app/vendor/support-fins/) at their next start, no new app release needed.
#   - The 2.0 web edition and the 2.0 downloads carry it from the next 2.0 release.
# Run it by hand (Actions > Support Fins update > Run workflow) to bring in a given tag now.

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Support Fins tag to vendor, e.g. v1.0.3 (empty = the newest release)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  actions: write

concurrency:
  group: support-fins-update
  cancel-in-progress: false

jobs:
  want:
    name: Is there a new engine?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    outputs:
      go: ${{ steps.want.outputs.go }}
      tag: ${{ steps.want.outputs.tag }}
      branch: ${{ steps.want.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Look for a new Support Fins release
        id: want
        run: |
          set +e
          python packaging/update_support_fins.py --check $TAG | tee check.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "10" ] || { [ -n "$TAG" ] && [ "$code" = "0" ]; }; then newer=true
          elif [ "$code" = "0" ]; then newer=false
          else exit "$code"; fi
          if [ "$newer" = false ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          tag="$TAG"
          # the check's own line: "Support Fins: installed v1.0.10, newest v1.0.11 (update available)"
          if [ -z "$tag" ]; then tag=$(sed -n 's/.*newest \(v[0-9][0-9.]*\).*/\1/p' check.txt | head -n 1); fi
          if [ -z "$tag" ]; then echo "::error::Could not read the new tag from the check's output."; exit 1; fi
          branch="support-fins/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # an open "waiting for a review" issue means this engine was already bundled and is
          # waiting for a person; a run started by hand tries again anyway
          waiting=$(gh issue list --state open --search "\"Support Fins $tag is waiting for a review\" in:title" --json number -q '.[].number' | head -n 1)
          if [ -n "$waiting" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "Support Fins $tag is waiting for a review: issue #$waiting."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    name: Bundle the engine on a branch
    needs: want
    if: ${{ needs.want.outputs.go == 'true' }}
    # the golden job of the Rust workflow checks the golden files on Windows, so they're made there
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.want.outputs.tag }}
      BRANCH: ${{ needs.want.outputs.branch }}
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      changed: ${{ steps.bump.outputs.changed }}
      summary: ${{ steps.bump.outputs.summary }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bundle the engine and rebuild the published copies
        run: |
          python -m pip install -r dev/parity/requirements-golden.txt
          git switch -c "$BRANCH"
          python packaging/update_support_fins.py "$TAG" --force
          python packaging/build_web.py

      - name: Rebuild the 2.0 golden files that name the engine
        id: bump
        run: |
          python dev/parity/fins_bump.py --summary "$RUNNER_TEMP/bump.json"
          changed=$(python -c "import json;print('true' if json.load(open(r'$RUNNER_TEMP/bump.json'))['changed'] else 'false')")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # the summary on one line, for the issue the last job may write
          echo "summary=$(python -c "import json;print(json.dumps(json.load(open(r'$RUNNER_TEMP/bump.json'))))")" >> "$GITHUB_OUTPUT"

      - name: Push the branch and start its checks
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web docs rust/tests/parity
          if git diff --cached --quiet; then
            echo "main already has Support Fins $TAG: nothing to do."
            exit 0
          fi
          git commit -m "Support Fins $TAG" \
            -m "Bundled by the Support Fins update workflow; golden files rebuilt by dev/parity/fins_bump.py."
          # made again from today's main each time, so an earlier try's branch is replaced
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # a branch pushed with the workflow's own token doesn't start them itself
          for wf in rust.yml tests.yml; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/dispatches" -f ref="$BRANCH"
          done

      - name: Report a failed update
        if: failure()
        run: |
          title="Support Fins $TAG couldn't be bundled"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "The Support Fins update couldn't bundle $TAG on a branch, rebuild the golden files or start the checks. Nothing was published; every edition keeps the previous engine.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi

  merge:
    name: Merge when the checks pass
    needs: [want, bump]
    if: ${{ needs.bump.outputs.sha != '' }}
    runs-on: ubuntu-latest
    # the Rust workflow builds and tests on three systems: allow it time
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.want.outputs.tag }}
      BRANCH: ${{ needs.want.outputs.branch }}
      SHA: ${{ needs.bump.outputs.sha }}
      CHANGED: ${{ needs.bump.outputs.changed }}
      SUMMARY: ${{ needs.bump.outputs.summary }}
    steps:
      - name: Wait for the checks
        id: wait
        run: |
          result() {  # the newest dispatched run of workflow $1 on the pushed commit: "status conclusion"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?head_sha=${SHA}&event=workflow_dispatch&per_page=1" \
              -q '.workflow_runs[0] | "\(.status) \(.conclusion)"'
          }
          ok=true
          for wf in rust.yml tests.yml; do
            for i in $(seq 1 460); do
              r=$(result "$wf" || true)
              case "$r" in completed*) break ;; esac
              sleep 30
            done
            echo "$wf: $r"
            [ "$r" = "completed success" ] || ok=false
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge when only the version moved
        if: steps.wait.outputs.ok == 'true' && env.CHANGED == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          # only the commit the checks ran on; if main moved since, it is merged with the newer
          # main, which is fine for a version-only change
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
            echo "::error::$BRANCH is no longer at $SHA, the commit that was checked."; exit 1
          fi
          git merge --no-ff "$SHA" -m "Support Fins $TAG" \
            -m "Merged by the Support Fins update workflow: the Rust and Tests checks passed and the fins are the same."
          git push origin HEAD:main
          git push origin --delete "$BRANCH"
          # ask Pages to deploy now (a push made by this workflow may not start a build on its own)
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true

      - name: Say why it's left for a person
        if: always() && (failure() || steps.wait.outputs.ok != 'true' || env.CHANGED != 'false')
        env:
          OK: ${{ steps.wait.outputs.ok }}
        run: |
          title="Support Fins $TAG is waiting for a review"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then exit 0; fi
          python - > body.md <<'EOF'
          import json, os
          e = os.environ
          s = json.loads(e.get("SUMMARY") or "{}")
          repo, branch, tag = e["GITHUB_REPOSITORY"], e["BRANCH"], e["TAG"]
          site = e["GITHUB_SERVER_URL"]
          out = [f"The daily Support Fins update bundled {tag} on the branch `{branch}`, but did not merge it. "
                 "Every edition keeps the previous engine until it is merged.", ""]
          if e.get("OK") != "true":
              out += ["**The Rust or Tests checks didn't pass on the branch.**", ""]
          elif s.get("changed"):
              out += ["**The checks passed, but the fins or the engine's report came out different with this engine.** "
                      "Golden files that changed:", ""]
              out += [f"- `{p}`" for p in s["changed"]]
          else:
              out += ["**The checks passed and only the version moved, but the merge into main didn't go through.**"]
          if s.get("notes"):
              out += ["", "Notes:", ""] + [f"- {n}" for n in s["notes"]]
          out += ["", f"What changed: {site}/{repo}/compare/main...{branch}",
                  f"Run: {site}/{repo}/actions/runs/{e['GITHUB_RUN_ID']}", "",
                  f"To take the engine: merge `{branch}` into `main` and close this issue. "
                  "To try again from today's main: close this issue and run the workflow by hand."]
          print("\n".join(out))
          EOF
          gh issue create --title "$title" --body-file body.md --assignee "$GITHUB_REPOSITORY_OWNER" \
            || gh issue create --title "$title" --body-file body.md