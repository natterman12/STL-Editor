name: Rust

on:
  push:
    paths:
      - "rust/**"
      - "dev/parity/**"
      - "stleditor/**"
      - "requirements.txt"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "dev/parity/**"
      - "stleditor/**"
      - "requirements.txt"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ startsWith(matrix.os, 'windows') && 'Windows' || 'Linux' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      # Keep line endings as committed: golden files are compared byte for byte.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v7

      # rust-toolchain.toml (in rust/) pins the version and the wasm32 target. It names no host,
      # so on Windows pick the gnu host first (same as the development PC).
      - name: Use the GNU host on Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test
        run: cargo test --workspace --release

      - name: Build for WebAssembly
        run: cargo build --target wasm32-unknown-unknown -p stl-kernel -p stl-parity -p stl-mesh -p stl-sketch -p stl-engine -p stl-io

      - name: Check the pure-Rust rule
        run: cargo run -p xtask -- pure-rust

  golden:
    name: Golden files and project round trip (Windows)
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Golden files are up to date
        shell: bash
        run: |
          python dev/parity/make_kernel_golden.py --check
          python dev/parity/make_expr_golden.py --check
          python dev/parity/make_golden.py --check

      - name: Use the GNU host
        shell: bash
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Install the pinned toolchain
        shell: bash
        working-directory: rust
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Write project files from Rust
        shell: bash
        working-directory: rust
        run: cargo test -p stl-engine --test stlx

      - name: Python opens what Rust wrote
        run: python dev/parity/open_check.py rust/target/parity-out
