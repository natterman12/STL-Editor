name: Rust

on:
  push:
    paths:
      - "rust/**"
      - "dev/parity/**"
      - "stleditor/**"
      - "requirements.txt"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
      - "dev/parity/**"
      - "stleditor/**"
      - "requirements.txt"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ startsWith(matrix.os, 'windows') && 'Windows' || 'Linux' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      # Keep line endings as committed: golden files are compared byte for byte.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v7

      # rust-toolchain.toml (in rust/) pins the version and the wasm32 target. It names no host,
      # so on Windows pick the gnu host first (same as the development PC).
      - name: Use the GNU host on Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install WebKitGTK and Xvfb (Linux Support Fins host)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev xvfb
        working-directory: .

      # Support Fins' webview host needs a display on Linux.
      - name: Test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test --workspace --release --no-fail-fast

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-${{ runner.os }}
          path: |
            rust/crates/stl-app/tests/snapshots/*.diff.png
            rust/crates/stl-app/tests/snapshots/*.new.png
          if-no-files-found: ignore

      - name: Support Fins cases on the WebView2 host
        if: runner.os == 'Windows'
        run: STL_FINS_HOST=webview cargo test --release -p stl-engine --test parity -- --nocapture

      - name: Build for WebAssembly
        run: |
          cargo build --target wasm32-unknown-unknown -p stl-kernel -p stl-parity -p stl-mesh -p stl-sketch -p stl-engine -p stl-io
          cargo build --target wasm32-unknown-unknown -p stl-app

      - name: Check the pure-Rust rule
        run: cargo run -p xtask -- pure-rust

  golden:
    name: Golden files and project round trip (Windows)
    runs-on: windows-latest
    steps:
      - name: Keep line endings as committed
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r dev/parity/requirements-golden.txt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install puppeteer-core globally
        run: npm install -g puppeteer-core

      - name: Install Chrome for import2d golden
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          # Pin to the Chrome used when generating import2d_golden locally
          # (Google Chrome 157.0.8103.51 on the golden machine; Chrome for Testing has no .51, so the same-branch .50).
          chrome-version: "157.0.8103.50"

      - name: Set CHROME_PATH
        shell: bash
        run: |
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "using ${{ steps.chrome.outputs.chrome-path }}"

      - name: Golden files are up to date
        shell: bash
        run: |
          python dev/parity/make_kernel_golden.py --check
          python dev/parity/make_expr_golden.py --check
          python dev/parity/make_golden.py --check
          python dev/parity/make_fins_golden.py --check
          python dev/parity/make_reader_golden.py --check
          python dev/parity/make_repair_golden.py --check
          python dev/parity/make_sketch_golden.py --check
          python dev/parity/make_text_golden.py --check
          python dev/parity/make_refs_golden.py --check
          python dev/parity/make_offset_corpus.py --check
          python dev/parity/make_voxel_golden.py --check
          python dev/parity/make_simplify_golden.py --check
          python dev/parity/make_export_golden.py --check
          node dev/parity/js/solver_golden.mjs --check
          node dev/parity/js/import2d_golden.mjs --check
          node dev/parity/js/remesh_golden.mjs --check
          node dev/parity/js/step_golden.mjs --check
          node dev/parity/js/tools_golden.mjs --check
          node dev/parity/js/sketchop_golden.mjs --check

      - name: Use the GNU host
        shell: bash
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Install the pinned toolchain
        shell: bash
        working-directory: rust
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Support Fins in the browser (web host)
        shell: bash
        working-directory: rust/crates/stl-app
        run: |
          npm install -g wasm-pack@0.15.1
          wasm-pack test --headless --chrome .

      - name: Write project files from Rust
        shell: bash
        working-directory: rust
        run: cargo test -p stl-engine --test stlx

      - name: Python opens what Rust wrote
        run: python dev/parity/open_check.py rust/target/parity-out

  # Milestone 4a: native stl-app release build, kittest UI tests, Windows exe artifact.
  stl-app:
    name: STL App (${{ startsWith(matrix.os, 'windows') && 'Windows' || 'Linux' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v7

      - name: Use the GNU host on Windows
        if: runner.os == 'Windows'
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # eframe / wgpu / egui need X11, Wayland and xkbcommon headers on Linux.
      # stl-platform (wry) needs WebKitGTK on Linux.
      - name: Install eframe / wgpu system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            xvfb
        working-directory: .

      - name: Build stl-app (release)
        run: cargo build -p stl-app --release

      - name: egui_kittest UI tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test -p stl-app --test ui

      - name: Tools golden (2.0 registry)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test -p stl-app --test tools_golden

      # Task 6 adds crates/stl-app/tests/sketchop_golden.rs; skip until that file exists.
      - name: SketchOp golden (2.0 route)
        run: |
          if [ -f crates/stl-app/tests/sketchop_golden.rs ]; then
            ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test -p stl-app --test sketchop_golden
          else
            echo "sketchop_golden.rs not present yet (M4c Task 6); skipping"
          fi

      - name: Upload Windows exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stl-app-windows
          path: rust/target/release/stl-app.exe
          if-no-files-found: warn

  # Milestone 4a: web build (xtask web) and headless-Chrome wasm tests without wasm-pack.
  stl-app-web:
    name: STL App web
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Host build of xtask pulls stl-platform (wry/WebKitGTK) via glib-sys.
      - name: Install eframe / wgpu system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev
        working-directory: .

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install chromedriver
        uses: nanasess/setup-chromedriver@v2

      # Matches wasm-bindgen = 0.2.130 in stl-app; provides wasm-bindgen-test-runner.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build the web app
        run: cargo run -p xtask -- web

      - name: Headless Chrome wasm tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          # setup-chrome leaves the binary path; put its directory on PATH as `chrome`.
          chrome_bin="${{ steps.chrome.outputs.chrome-path }}"
          chrome_dir="$(dirname "$chrome_bin")"
          [ "$(basename "$chrome_bin")" = chrome ] || ln -sf "$chrome_bin" "$chrome_dir/chrome"
          export PATH="$chrome_dir:$PATH"
          export CHROMEDRIVER="$(command -v chromedriver)"
          cargo test -p stl-app --target wasm32-unknown-unknown

      # The runner has no GPU, so WebGPU can't start there: check the WebGL2 path on SwiftShader.
      # The WebGPU check (xtask web --check) runs on a machine with a GPU.
      - name: Headless check of the running web app (WebGL2, software)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: cargo run -p xtask -- web --check --webgl2

  # M5 Task 0: test-build artefacts on every push, kept as workflow artefacts. Nothing is
  # attached to a release and no tag is made (spec 2.5).
  artefacts:
    name: Artefacts (${{ matrix.label }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows exe, os: windows-latest, kind: windows }
          - { label: macOS app, os: macos-latest, kind: mac }
          - { label: Linux AppImage, os: ubuntu-latest, kind: linux }
          - { label: web build, os: ubuntu-latest, kind: web }
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@v7

      - name: Use the GNU host on Windows
        if: matrix.kind == 'windows'
        run: rustup set default-host x86_64-pc-windows-gnu

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install eframe / wgpu system libraries (Linux)
        if: matrix.kind == 'linux' || matrix.kind == 'web'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config \
            libwebkit2gtk-4.1-dev
        working-directory: .

      # Release build of the desktop app (Windows, macOS, Linux).
      - name: Build stl-app (release)
        if: matrix.kind != 'web'
        run: cargo build -p stl-app --release

      # The Windows exe is uploaded as it is.
      - name: Upload Windows exe
        if: matrix.kind == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: stl-editor-2-windows-exe
          path: rust/target/release/stl-app.exe
          if-no-files-found: error

      # macOS: a minimal .app bundle around the release binary, zipped with ditto (keeps the
      # bundle's symlinks and attributes).
      - name: Make the macOS app bundle
        if: matrix.kind == 'mac'
        run: |
          app="dist/STL Editor 2.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/stl-app "$app/Contents/MacOS/stl-app"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>STL Editor 2</string>
            <key>CFBundleDisplayName</key><string>STL Editor 2</string>
            <key>CFBundleIdentifier</key><string>com.natterman12.stl-editor-2.test</string>
            <key>CFBundleExecutable</key><string>stl-app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0.0-test</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          ditto -c -k --keepParent "$app" dist/STL-Editor-2-macOS.app.zip

      - name: Upload macOS app
        if: matrix.kind == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: stl-editor-2-macos-app
          path: rust/dist/STL-Editor-2-macOS.app.zip
          if-no-files-found: error

      # Linux: an AppDir with AppRun, a desktop entry and the icon, packed by appimagetool.
      # APPIMAGE_EXTRACT_AND_RUN lets appimagetool run without FUSE on the runner.
      - name: Make the Linux AppImage
        if: matrix.kind == 'linux'
        run: |
          appdir=dist/STL_Editor_2.AppDir
          mkdir -p "$appdir/usr/bin"
          cp target/release/stl-app "$appdir/usr/bin/stl-app"
          cp ../web/icon-512.png "$appdir/stl-editor-2.png"
          cat > "$appdir/stl-editor-2.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=STL Editor 2
          Exec=stl-app
          Icon=stl-editor-2
          Categories=Graphics;3DGraphics;
          DESKTOP
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/stl-app" "$@"\n' > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" dist/STL-Editor-2-x86_64.AppImage

      - name: Upload Linux AppImage
        if: matrix.kind == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: stl-editor-2-linux-appimage
          path: rust/dist/STL-Editor-2-x86_64.AppImage
          if-no-files-found: error

      # Web edition: the same build as the web job above, staged with its page and worker.
      - name: Install wasm-bindgen-cli
        if: matrix.kind == 'web'
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Build the web app
        if: matrix.kind == 'web'
        run: |
          cargo run -p xtask -- web
          mkdir -p dist/web
          cp -r crates/stl-app/web/. dist/web/
          cp -r target/web/. dist/web/

      - name: Upload web build
        if: matrix.kind == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: stl-editor-2-web
          path: rust/dist/web/
          if-no-files-found: error
