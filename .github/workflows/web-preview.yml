name: Web preview (2.0)

# Publishes the STL Editor 2.0 web build by committing it to main (GitHub Pages serves docs/
# from main):
#   - docs/app2, the preview at https://natterman12.github.io/STL-Editor/app2/ : every time.
#   - docs/app, the web edition itself at https://natterman12.github.io/STL-Editor/app/ : only
#     for the tag of a full release (v2.0.0, v2.1.3; not v2.1.0-beta.1). docs/app/vendor/support-fins
#     is left alone: installed desktop apps download Support Fins engine updates from there
#     (packaging/build_web.py writes it).
# The 1.x web edition is docs/app1 and is not touched.
#
# It builds nothing. The Rust workflow (rust.yml, on the 2.0 branch) tests every push and keeps
# the web build as the artefact "stl-editor-2-web"; this workflow publishes one of those:
#   - Run by hand (Actions > Web preview (2.0) > Run workflow): the newest Rust run that passed
#     on the chosen branch (v2-main unless you type another).
#   - A pushed v2.* tag: that tag's own Rust run, once it has passed (about an hour).
#
# The preview is marked "noindex" so search engines leave it alone (the copy in docs/app is
# not), and build.json says which commit it came from. Each publish of a changed build adds about 8 MB to the repository,
# which is why this does not run on every push.
#
# This file is the same on main and on the 2.0 branch: GitHub only offers "Run workflow" for a
# file on the default branch, and a tag uses the file in the tagged commit.

on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose newest green Rust run is published"
        required: true
        default: v2-main

permissions:
  contents: write
  actions: read
  pages: write

concurrency:
  group: web-preview
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BRANCH: ${{ inputs.branch }}

jobs:
  publish:
    name: Publish the 2.0 web build
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Find the Rust run to publish
        id: rust
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # The run started by the push of this tag (for a tag, a run's branch is the tag's name).
            from="$GITHUB_REF_NAME"
            sha="$GITHUB_SHA"
            while :; do
              runs=$(gh run list --workflow rust.yml --commit "$sha" --branch "$from" --event push \
                       --limit 30 --json databaseId,status,conclusion)
              run=$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")][0].databaseId // empty' <<<"$runs")
              if [ -n "$run" ]; then break; fi
              waiting=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
              # The first minutes: the tag's own Rust run may not be listed yet.
              if [ "$waiting" = 0 ] && [ "$SECONDS" -gt 300 ]; then
                echo "::error::The Rust run of tag $from ($sha) did not pass and none is running. Re-run its failed jobs, then re-run this job."
                exit 1
              fi
              if [ "$SECONDS" -gt 12600 ]; then
                echo "::error::Waited three and a half hours for the Rust run of $from."
                exit 1
              fi
              echo "Waiting: $waiting Rust run(s) of $from still going"
              sleep 60
            done
          else
            from="$BRANCH"
            found=$(gh run list --workflow rust.yml --branch "$from" --event push --status success \
                      --limit 1 --json databaseId,headSha)
            run=$(jq -r '.[0].databaseId // empty' <<<"$found")
            sha=$(jq -r '.[0].headSha // empty' <<<"$found")
            if [ -z "$run" ]; then
              echo "::error::No Rust run has passed on the branch \"$from\"."
              exit 1
            fi
            head=$(gh api "repos/$GH_REPO/commits/$from" --jq .sha)
            if [ "$head" != "$sha" ]; then
              echo "::notice::Publishing $sha, the newest commit of $from with a green Rust run. The branch itself is at $head."
            fi
          fi
          echo "Publishing the web build of $sha ($from), Rust run $run"
          { echo "run=$run"; echo "sha=$sha"; echo "from=$from"; } >> "$GITHUB_OUTPUT"

      - name: Fetch the web build
        env:
          RUN: ${{ steps.rust.outputs.run }}
        run: |
          gh run download "$RUN" --name stl-editor-2-web --dir "$RUNNER_TEMP/web" || {
            echo "::error::Rust run $RUN has no web build to download (GitHub deletes them after 90 days). Push to the branch again, or re-run that Rust run."
            exit 1
          }
          cd "$RUNNER_TEMP/web"
          for f in index.html worker.js coverage_worker.js stl-app.js stl-app_bg.wasm support-fins/engine.iife.js; do
            if [ ! -s "$f" ]; then
              echo "::error::The web build has no $f; not publishing."
              ls -lR .
              exit 1
            fi
          done

      - name: Mark it as a preview
        env:
          RUN: ${{ steps.rust.outputs.run }}
          SHA: ${{ steps.rust.outputs.sha }}
          FROM: ${{ steps.rust.outputs.from }}
        run: |
          cd "$RUNNER_TEMP/web"
          rm -f ./*.d.ts   # type listings for programmers; the page doesn't load them
          printf '{"commit": "%s", "from": "%s", "rust_run": %s}\n' "$SHA" "$FROM" "$RUN" > build.json
          # the copy for /app/ (a full release only): as built, search engines welcome
          cp -r . "$RUNNER_TEMP/release"
          sed -i 's|<meta charset="utf-8">|<meta charset="utf-8">\n  <meta name="robots" content="noindex">|' index.html
          grep -q 'name="robots" content="noindex"' index.html || {
            echo "::error::Could not add the noindex line to index.html; not publishing."
            exit 1
          }

      - name: Commit it to main
        env:
          SHA: ${{ steps.rust.outputs.sha }}
          FROM: ${{ steps.rust.outputs.from }}
        run: |
          rm -rf docs/app2
          mkdir -p docs/app2
          cp -r "$RUNNER_TEMP/web/." docs/app2/
          git add -f -A docs/app2
          what="Web preview: STL Editor 2.0 at /app2/ from ${SHA:0:7} ($FROM)"
          # A full release (a pushed tag with no suffix) is the web edition itself, at /app/.
          release=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$FROM" in *-*) ;; *) release=true ;; esac
          fi
          if [ "$release" = true ]; then
            mkdir -p docs/app
            # everything but vendor/support-fins, the engine update address of installed apps
            find docs/app -mindepth 1 -maxdepth 1 ! -name vendor -exec rm -rf {} +
            if [ -d docs/app/vendor ]; then
              find docs/app/vendor -mindepth 1 -maxdepth 1 ! -name support-fins -exec rm -rf {} +
            fi
            cp -r "$RUNNER_TEMP/release/." docs/app/
            git add -f -A docs/app
            what="Web edition: STL Editor ${FROM#v} at /app/ (and the /app2/ preview)"
          fi
          if git diff --cached --quiet; then
            echo "main already holds this build; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$what" \
            -m "Published by the Web preview (2.0) workflow from the web build of a Rust run that passed."
          for try in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$try" = 3 ]; then echo "::error::Could not push to main."; exit 1; fi
            git pull --rebase origin main
          done
          # ask Pages to deploy now (a push made by a workflow may not start a build on its own)
          gh api -X POST "repos/$GH_REPO/pages/builds" > /dev/null || true
          {
            echo "Published ${SHA:0:7} ($FROM) to docs/app2."
            echo "Live in a minute or two: https://natterman12.github.io/STL-Editor/app2/"
            if [ "$release" = true ]; then
              echo "A full release: also published to docs/app, https://natterman12.github.io/STL-Editor/app/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
