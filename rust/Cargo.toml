[workspace]
members = ["crates/*", "xtask"]
exclude = ["third_party"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.0-dev"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Our copy of manifold-rust, so the kernel's speed can be fixed here (third_party/manifold-rust/VENDORED.md).
[patch.crates-io]
manifold-rust = { path = "third_party/manifold-rust" }
