[workspace]
members = ["crates/*", "xtask"]
exclude = ["third_party"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.4-dev"
publish = false

# Lints for our crates (each crate has `[lints] workspace = true`). CI runs
# `cargo clippy --workspace --all-targets -- -D warnings`, so a new warning fails the build.
# The ones switched off are deliberate here, not oversights:
[workspace.lints.clippy]
# `!(a < b)` is written on purpose: it is also true when a value is NaN, which `a >= b` is not.
neg_cmp_op_on_partial_ord = "allow"
# `clamp` panics when min > max and treats NaN differently; the engines' results must not change.
manual_clamp = "allow"
# Numbers are kept as they are written in the Python and JavaScript engines.
excessive_precision = "allow"
# Index loops over vertex and triangle buffers follow the other engines line for line.
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
# Shape of the code, not mistakes: left for a refactor of their own.
type_complexity = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
# Test files share helper modules by #[path], which is how Cargo test targets share code.
duplicate_mod = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# For running the tests on CI (`--cargo-profile test-fast` with nextest, `--profile test-fast` with
# cargo test). Optimised like release, but without optimising each program as a whole: the
# workspace has about 120 test programs and fat LTO on each took most of an hour on CI.
# The app that ships is still built with the release profile above.
[profile.test-fast]
inherits = "release"
lto = false
codegen-units = 16

# Our copy of manifold-rust, so the kernel's speed can be fixed here (third_party/manifold-rust/VENDORED.md).
[patch.crates-io]
manifold-rust = { path = "third_party/manifold-rust" }
# Our copy of egui-wgpu 0.37.0: a refused upload after a driver reset is reported instead of
# panicking inside the window procedure (third_party/egui-wgpu/VENDORED.md).
egui-wgpu = { path = "third_party/egui-wgpu" }

# Slimmer debug builds (2026-11-11): line numbers for our code, no debug info for dependencies.
# The debug test builds were about 20 GB with full debug info; results are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
