<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100">
  <!-- zero-size rect (Chrome still measures perimeter); then polyline; display:none path; empty d; closed path -->
  <rect x="10" y="10" width="0" height="20"/>
  <polyline points="0,0 10,0 10,10" fill="none" stroke="black"/>
  <path style="display:none" d="M0,50 L20,50 L20,70 Z"/>
  <path d=""/>
  <path d="M40,40 L60,40 L60,60 L40,60 Z"/>
</svg>
