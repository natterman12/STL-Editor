[package]
name = "stl-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

# manifold-rust is used by this crate only, and none of its types are in our public interface.
# Its threads (rayon) are for native targets; the web build runs single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
manifold-rust = { version = "=0.19.2", features = ["parallel"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
manifold-rust = "=0.19.2"

# Test-only: the 1.x comparison rules and the corpus reader. Never part of the shipped app.
[dev-dependencies]
stl-parity = { path = "../stl-parity" }
serde_json = "1"
