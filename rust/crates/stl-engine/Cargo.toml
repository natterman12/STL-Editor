[package]
name = "stl-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stl-kernel = { path = "../stl-kernel" }
stl-mesh = { path = "../stl-mesh" }
stl-sketch = { path = "../stl-sketch" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Test-only: the 1.x comparison rules, used by tests/parity.rs. Never part of the shipped app.
[dev-dependencies]
stl-parity = { path = "../stl-parity" }
