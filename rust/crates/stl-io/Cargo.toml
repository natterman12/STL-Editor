[package]
name = "stl-io"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stl-kernel = { path = "../stl-kernel" }
stl-mesh = { path = "../stl-mesh" }
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
serde_json = "1"

[dev-dependencies]
stl-parity = { path = "../stl-parity" }

# Property tests (tests/prop_readers.rs): damaged and random files must open or give a message.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints]
workspace = true
