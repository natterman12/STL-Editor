[package]
name = "stl-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
stl-kernel = { path = "../stl-kernel" }
stl-mesh = { path = "../stl-mesh" }
stl-sketch = { path = "../stl-sketch" }
stl-engine = { path = "../stl-engine" }
stl-io = { path = "../stl-io" }
stl-platform = { path = "../stl-platform" }
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11"] }
egui = "0.37"
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "metal", "vulkan"] }
web-time = "1"
serde_json = "1"
resvg = { version = "0.45", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "pollster"] }
rayon = "1.12"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
web-sys = { version = "0.3", features = ["Worker", "WorkerOptions", "WorkerType", "MessageEvent", "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "Url", "HtmlInputElement", "HtmlAnchorElement", "HtmlElement", "Document", "Window", "DragEvent", "DataTransfer", "ErrorEvent", "Event", "EventTarget", "HtmlCanvasElement", "DedicatedWorkerGlobalScope"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot"] }
image = { version = "0.25", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"
serde_json = "1"
sha2 = "0.10"
stl-mesh = { path = "../stl-mesh" }
